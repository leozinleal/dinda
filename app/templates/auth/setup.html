{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Primeiro acesso{% endblock %}
{% block content %}
<div class="login-box">
  <div class="text-center mb-4">
    <i class="bi bi-buildings display-4 text-primary"></i>
    <h1 class="h4 mt-2">Primeiro acesso</h1>
    <p class="text-muted">Crie o usuário administrador do sistema.</p>
  </div>
  <div class="card"><div class="card-body p-4">
    <form method="post">
      {{ csrf() }}
      <div class="mb-3"><label class="form-label">Nome da construtora</label>
        <input class="form-control" name="empresa" placeholder="Ex.: Construtora Exemplo Ltda"></div>
      <div class="mb-3"><label class="form-label">Seu nome</label>
        <input class="form-control" name="nome" required></div>
      <div class="mb-3"><label class="form-label">E-mail (usado para entrar)</label>
        <input type="email" class="form-control" name="email" required></div>
      <div class="mb-3"><label class="form-label">Senha (mínimo 6 caracteres)</label>
        <input type="password" class="form-control" name="senha" minlength="6" required></div>
      <button class="btn btn-primary w-100">Criar e entrar</button>
    </form>
  </div></div>
</div>
{% endblock %}
