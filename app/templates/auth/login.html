{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="login-box">
  <div class="text-center mb-4">
    <i class="bi bi-buildings display-4 text-primary"></i>
    <h1 class="h4 mt-2">Gestão da Construtora</h1>
  </div>
  <div class="card"><div class="card-body p-4">
    <form method="post">
      {{ csrf() }}
      <div class="mb-3"><label class="form-label">E-mail</label>
        <input type="email" class="form-control" name="email" required autofocus></div>
      <div class="mb-3"><label class="form-label">Senha</label>
        <input type="password" class="form-control" name="senha" required></div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
  </div></div>
</div>
{% endblock %}
