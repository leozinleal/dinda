{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block content %}
<div class="titulo-pagina"><h1>{{ 'Editar fornecedor' if fo.id else 'Novo fornecedor' }}</h1></div>
<div class="card" style="max-width:900px"><div class="card-body">
  <form method="post" class="row g-3">
    {{ csrf() }}
    <div class="col-md-7"><label class="form-label">Razão social / nome *</label><input class="form-control" name="nome" value="{{ fo.nome or '' }}" required></div>
    <div class="col-md-5"><label class="form-label">Nome fantasia</label><input class="form-control" name="nome_fantasia" value="{{ fo.nome_fantasia or '' }}"></div>
    <div class="col-md-4"><label class="form-label">CNPJ / CPF</label><input class="form-control" name="cpf_cnpj" value="{{ fo.cpf_cnpj or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Ramo</label><select class="form-select" name="categoria"><option value="">—</option>
      {% for c in categorias %}<option {{ 'selected' if fo.categoria == c }}>{{ c }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Pessoa de contato</label><input class="form-control" name="contato" value="{{ fo.contato or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Telefone / WhatsApp</label><input class="form-control" name="telefone" value="{{ fo.telefone or '' }}"></div>
    <div class="col-md-4"><label class="form-label">E-mail</label><input type="email" class="form-control" name="email" value="{{ fo.email or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Chave PIX</label><input class="form-control" name="chave_pix" value="{{ fo.chave_pix or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Endereço</label><input class="form-control" name="endereco" value="{{ fo.endereco or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Banco / agência / conta</label><input class="form-control" name="dados_bancarios" value="{{ fo.dados_bancarios or '' }}"></div>
    <div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" name="observacoes" rows="3">{{ fo.observacoes or '' }}</textarea></div>
    <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="ativo" id="ativo" value="1" {{ 'checked' if fo.ativo }}>
      <label class="form-check-label" for="ativo">Fornecedor ativo</label></div>
    <div class="col-12 d-flex gap-2">
      <button class="btn btn-primary">Salvar</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('com.fornecedor_detalhe', id=fo.id) if fo.id else url_for('com.fornecedores') }}">Cancelar</a>
    </div>
  </form>
</div></div>
{% endblock %}
